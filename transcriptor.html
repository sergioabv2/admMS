<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mozart+ Transcriptor Test</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --surface: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: var(--surface);
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        h1 { margin-top: 0; font-size: 1.5rem; }
        p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 2rem; }

        .drop-zone {
            border: 2px dashed var(--border);
            border-radius: 0.75rem;
            padding: 3rem 1.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .drop-zone.dragover {
            border-color: var(--primary);
            background-color: rgba(99, 102, 241, 0.1);
        }

        .drop-zone:hover { border-color: var(--primary); }

        .file-input { display: none; }

        .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: block;
        }

        .status {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            min-height: 1.5rem;
            color: var(--primary);
        }

        /* Animación de carga */
        .loader {
            border: 3px solid var(--border);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Mozart+ Transcriptor</h1>
        <p>Arrastra tu partitura (Imagen o PDF) aquí para convertirla a MusicXML.</p>

        <div class="drop-zone" id="dropZone">
            <span class="icon">📄</span>
            <span>Haz clic o arrastra los archivos aquí</span>
            <input type="file" id="fileInput" class="file-input" multiple accept=".pdf, .jpg, .jpeg, .png, .webp">
        </div>

        <div class="status" id="statusMessage">
            <div class="loader" id="loader"></div>
            <span id="statusText"></span>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const statusText = document.getElementById('statusText');
        const loader = document.getElementById('loader');

        // Eventos de Drag & Drop
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) processFiles(files);
        });

        // Evento de clic para abrir explorador
        dropZone.addEventListener('click', () => fileInput.click());
        
        fileInput.addEventListener('change', function() {
            if (this.files.length > 0) processFiles(this.files);
        });

        async function processFiles(files) {
            const formData = new FormData();
            
            // Agregamos todos los archivos al formData bajo la llave 'file'
            for (let i = 0; i < files.length; i++) {
                formData.append('file', files[i]);
            }

            // UI Feedback
            loader.style.display = 'inline-block';
            statusText.textContent = `Enviando ${files.length} archivo(s) a Cloud Run... (Esto tomará unos minutos)`;
            dropZone.style.pointerEvents = 'none';
            dropZone.style.opacity = '0.5';

           try {
              // Tu URL de producción
                const response = await fetch('https://api-transcriptor-mozart-145083375828.us-central1.run.app/api/procesar', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.error || 'Error desconocido en la API');
                }

                statusText.textContent = "¡Partitura procesada! Descargando elegante archivo...";

                // Convertimos la respuesta en un Blob (archivo crudo)
                const blob = await response.blob();
                
                // Extraemos el nombre del archivo de los headers si es posible, o le ponemos uno por defecto
                let filename = "partitura_mozart.musicxml";
                const disposition = response.headers.get('Content-Disposition');
                if (disposition && disposition.indexOf('attachment') !== -1) {
                    const filenameRegex = /filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/;
                    const matches = filenameRegex.exec(disposition);
                    if (matches != null && matches[1]) { 
                        filename = matches[1].replace(/['"]/g, '');
                    }
                }

                // Magia para forzar la descarga en el navegador
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                
                // Limpieza
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
                
                statusText.textContent = "¡Descarga completada con éxito!";
                statusText.style.color = "#10b981"; // Verde éxito

            } catch (error) {
                console.error(error);
                statusText.textContent = `❌ Error: ${error.message}`;
                statusText.style.color = "#ef4444"; // Rojo error
            } finally {
                loader.style.display = 'none';
                dropZone.style.pointerEvents = 'auto';
                dropZone.style.opacity = '1';
                fileInput.value = ''; // Reset input
            }
        }
    </script>
</body>
</html>
